<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snow Forecast</title>
  <link rel="icon" href="badge.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="forecast.css">
</head>
<body class="fc">
  <header class="fc-head">
    <a href="resorts.html" class="back" title="All resorts">← Resorts</a>
    <span id="badge" class="badge"></span>
    <div>
      <h1><span id="rname">&nbsp;</span> <span class="muted" id="rpoint"></span><img src="alta-mountain.svg" alt="" class="mountain-logo" id="alta-logo" hidden></h1>
      <p class="sub" id="status">Loading forecast…</p>
    </div>
    <a href="scorecard.html" class="score-link" id="score-link" title="How accurate this forecast has been" hidden>Scorecard</a>
    <button id="refresh" title="Fetch fresh data">Refresh</button>
  </header>

  <div id="alerts"></div>

  <main>
    <section class="card">
      <h2>Snow summary <span class="muted">· each day is 6 pm the night before to 6 pm</span></h2>
      <div id="summary" class="summary"></div>
      <div class="odds-wrap">
        <span class="odds-label">Chance of 6"+ <small>%</small></span>
        <div id="odds" class="odds"></div>
      </div>
      <div class="legend-row"><span id="legend"></span><span class="muted" id="opening"></span></div>
      <p class="hint" id="summary-hint"></p>
    </section>

    <section class="card" id="cams-card">
      <h2>Live cams</h2>
      <div id="cams"></div>
    </section>

    <section class="card">
      <h2>Day &amp; night</h2>
      <div id="periods" class="scroll-x"></div>
    </section>

    <section class="card">
      <h2>Hourly</h2>
      <div class="jump-row"><span class="muted">Jump to</span><div id="jump" class="jump"></div></div>
      <div id="hourly" class="scroll-x hourly"></div>
    </section>

    <section class="card">
      <h2>Models side by side</h2>
      <div id="cumulative" class="cumulative"></div>
      <p class="hint" id="models-hint"></p>
      <div id="models" class="scroll-x"></div>
    </section>

    <section class="card">
      <h2>What actually fell <span class="muted" id="obs-where"></span></h2>
      <div id="observed"></div>
    </section>

    <section class="card">
      <h2>NWS forecast discussion</h2>
      <div id="afd" class="afd"></div>
    </section>

    <section class="card method">
      <h2>How these numbers are made</h2>
      <div id="method"></div>
    </section>
  </main>

  <script src="snow.js"></script>
  <script src="forecast-data.js"></script>
  <script src="snowbars.js"></script>
  <script src="forecast.js"></script>
</body>
</html>
