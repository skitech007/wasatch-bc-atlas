<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Snow Forecast · Wasatch BC Atlas</title>
  <link rel="icon" href="badge.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="forecast.css">
</head>
<body class="page fc">
  <header class="topbar">
    <a href="resorts.html" class="icon-btn" aria-label="All resorts"><i data-icon="back"></i></a>
    <div class="topbar-title">
      <span id="badge" class="badge"></span>
      <div><h1 id="rname">&nbsp;</h1><p class="sub" id="status">Loading forecast…</p></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Glare mode"></button>
      <button class="icon-btn" id="refresh" aria-label="Refresh forecast"><i data-icon="refresh"></i></button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Forecast">
    <a href="#snow" role="tab" data-tab="snow" aria-selected="true">Snow</a><a href="#hourly" role="tab" data-tab="hourly">Hourly</a><a href="#cams" role="tab" data-tab="cams">Cams</a><a href="#report" role="tab" data-tab="report">Report</a><a href="#models" role="tab" data-tab="models">Models</a>
  </nav>

  <div id="alerts"></div>

  <main class="page-main">
    <div class="tab-panel" id="t-snow" role="tabpanel">
      <section class="card" id="s-summary">
        <div class="card-head"><div class="title-info"><h2>Next 15 days</h2><button type="button" class="info-btn" aria-label="How to read this chart" aria-expanded="false" aria-controls="summary-info">?</button></div><span id="opening"></span></div>
        <div class="info-body" id="summary-info" hidden><p id="summary-hint"></p></div>
        <div id="summary" class="summary"><div class="skeleton sk-block"></div></div>
        <p class="day-detail" id="day-detail" aria-live="polite"></p>
        <div id="legend"></div>
      </section>

      <section class="card" id="s-periods">
        <div class="card-head"><h2>Day &amp; night</h2><span class="muted">Swipe for later days</span></div>
        <div id="periods"><div class="skeleton sk-block"></div></div>
      </section>
    </div>

    <div class="tab-panel" id="t-hourly" role="tabpanel" hidden>
      <section class="card" id="s-hourly">
        <div class="card-head"><h2>Hourly</h2><span class="muted" id="hourly-day"></span></div>
        <div id="jump" class="segmented" role="tablist" aria-label="Day"></div>
        <div id="hourly" class="hourly"></div>
      </section>
    </div>

    <div class="tab-panel" id="t-cams" role="tabpanel" hidden>
      <section class="card" id="s-cams">
        <div class="card-head"><div class="title-info"><h2>Live cams</h2><button type="button" class="info-btn" aria-label="About these cams" aria-expanded="false" aria-controls="cams-info">?</button></div></div>
        <div class="info-body" id="cams-info" hidden></div>
        <div id="cams"></div>
      </section>
    </div>

    <div class="tab-panel" id="t-report" role="tabpanel" hidden>
      <section class="card" id="s-observed">
        <div class="card-head"><div class="title-info"><h2>What actually fell</h2><button type="button" class="info-btn" aria-label="How this is measured" aria-expanded="false" aria-controls="observed-info">?</button></div><span class="muted" id="obs-where"></span></div>
        <div class="info-body" id="observed-info" hidden></div>
        <div id="observed"></div>
      </section>
      <section class="card" id="s-afd">
        <div class="card-head"><h2>NWS forecast discussion</h2></div>
        <div id="afd" class="afd"></div>
      </section>
    </div>

    <div class="tab-panel" id="t-models" role="tabpanel" hidden>
      <section class="card" id="s-models">
        <div class="card-head"><div class="title-info"><h2>Models side by side</h2><button type="button" class="info-btn" aria-label="How these numbers are made" aria-expanded="false" aria-controls="models-info">?</button></div></div>
        <div class="info-body method" id="models-info" hidden><p id="models-hint"></p><h3>How these numbers are made</h3><div id="method"></div></div>
        <div id="cumulative" class="cumulative"></div>
        <div id="models" class="scroll-x"></div>
      </section>
    </div>
  </main>

  <script src="snow.js"></script>
  <script src="forecast-data.js"></script>
  <script src="snowbars.js"></script>
  <script src="avalanche.js"></script>
  <script src="forecast.js"></script>
</body>
</html>
